<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  background: transparent;
  width: 100%; height: 100%;
  overflow: hidden;
}

#panel {
  position: absolute; inset: 0;
  border-radius: 20px;
  background: rgba(13,13,20,0.98);
  -webkit-backdrop-filter: blur(40px);
  backdrop-filter: blur(40px);
  border: 1px solid rgba(255,255,255,0.07);
  display: flex; flex-direction: column;
  overflow: hidden;
}
#panel::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--accent, rgba(99,102,241,0.7)), transparent);
}

.header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); flex-shrink: 0; }
.av { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, var(--accent, #6366f1), var(--accent2, #8b5cf6)); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; position: relative; }
.av-dot { position: absolute; bottom: -1px; right: -1px; width: 11px; height: 11px; background: #22c55e; border-radius: 50%; border: 2px solid rgba(13,13,20,0.97); }
.hname { font-size: 14px; font-weight: 700; color: #f0f0f5; }
.hstatus { font-size: 11px; color: #22c55e; font-weight: 500; margin-top: 1px; }
.hbtns { margin-left: auto; display: flex; gap: 6px; }
.hbtn { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; font-family: inherit; }
.hbtn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
.hbtn:focus-visible { outline: 2px solid var(--accent, #6366f1); outline-offset: 1px; }

.msgs { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.date-div { text-align: center; font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin: 4px 0; }

.bot-msg { display: flex; gap: 8px; align-items: flex-start; animation: fadeUp 0.3s ease both; }
.bot-av { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--accent, #6366f1), var(--accent2, #8b5cf6)); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; margin-top: 2px; }
.bot-wrap { display: flex; flex-direction: column; max-width: calc(100% - 38px); }
.bot-bubble { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); padding: 10px 14px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.bot-bubble.error { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
.bot-bubble a { color: #a5b4fc; text-decoration: underline; }
.bot-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; padding-left: 4px; }

.bot-bubble h1, .bot-bubble h2, .bot-bubble h3, .bot-bubble h4, .bot-bubble h5, .bot-bubble h6 { font-size: 14px; font-weight: 700; margin: 10px 0 4px; color: rgba(255,255,255,0.95); line-height: 1.3; }
.bot-bubble h1, .bot-bubble h2 { font-size: 15px; }
.bot-bubble h3 { font-size: 14px; color: rgba(165,180,252,0.95); }
.bot-bubble h4, .bot-bubble h5, .bot-bubble h6 { font-size: 13px; color: rgba(165,180,252,0.95); }
.bot-bubble p { margin: 4px 0; }
.bot-bubble hr { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 10px 0; }
.bot-bubble table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
.bot-bubble th, .bot-bubble td { padding: 6px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
.bot-bubble th { font-weight: 600; color: rgba(165,180,252,0.95); background: rgba(255,255,255,0.03); }
.bot-bubble td:last-child { text-align: right; font-weight: 600; color: rgba(134,239,172,0.95); }
.bot-bubble ul, .bot-bubble ol { margin: 4px 0 4px 20px; padding: 0; }
.bot-bubble li { margin: 2px 0; }
.bot-bubble li::marker { color: rgba(165,180,252,0.7); }
.bot-bubble strong { color: rgba(255,255,255,1); font-weight: 600; }
.bot-bubble em { color: rgba(255,255,255,0.95); }
.bot-bubble code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.bot-bubble pre { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 8px 10px; margin: 6px 0; overflow-x: auto; font-size: 12px; }
.bot-bubble pre code { background: transparent; padding: 0; }
.bot-bubble blockquote { border-left: 2px solid rgba(165,180,252,0.5); padding-left: 10px; margin: 6px 0; color: rgba(255,255,255,0.75); font-style: italic; }
.bot-bubble :first-child { margin-top: 0; }
.bot-bubble :last-child { margin-bottom: 0; }

.user-msg { display: flex; justify-content: flex-end; animation: fadeUp 0.3s ease both; }
.user-wrap { display: flex; flex-direction: column; align-items: flex-end; max-width: 75%; }
.user-bubble { background: linear-gradient(135deg, var(--accent, #6366f1), var(--accent2, #7c3aed)); color: white; font-weight: 600; padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.6; box-shadow: 0 4px 16px rgba(99,102,241,0.3); word-break: break-word; white-space: normal; }
.user-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; padding-right: 4px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.typing { display: flex; gap: 8px; align-items: flex-start; animation: fadeUp 0.3s ease both; }
.typing-bubble { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px 16px 16px 4px; padding: 12px 16px; display: flex; gap: 5px; align-items: center; }
.td { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); animation: tdB 1.2s ease infinite; }
.td:nth-child(2) { animation-delay: 0.15s; }
.td:nth-child(3) { animation-delay: 0.3s; }
@keyframes tdB { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; flex-shrink: 0; }
.chip { padding: 7px 13px; border-radius: 100px; background: var(--accent-dim, rgba(99,102,241,0.1)); border: 1px solid var(--accent-border, rgba(99,102,241,0.3)); color: rgba(160,165,255,0.9); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap; }
.chip:hover { background: var(--accent-dim-hover, rgba(99,102,241,0.25)); color: white; }
.chip:focus-visible { outline: 2px solid var(--accent, #6366f1); outline-offset: 2px; }

.input-area { padding: 10px 14px 14px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.inp { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 13px; color: rgba(255,255,255,0.9); font-family: inherit; font-size: 14px; outline: none; resize: none; max-height: 100px; min-height: 42px; line-height: 1.5; transition: all 0.2s; overflow-y: auto; }
.inp::placeholder { color: rgba(255,255,255,0.35); }
.inp:focus { border-color: var(--accent, #6366f1); background: rgba(255,255,255,0.07); }
.sbtn { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg, var(--accent, #6366f1), var(--accent2, #7c3aed)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
.sbtn:hover:not(:disabled) { transform: scale(1.08); }
.sbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.sbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.ftxt { text-align: center; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px; }

.error-screen { display: flex; align-items: center; justify-content: center; padding: 40px 24px; text-align: center; flex-direction: column; gap: 12px; height: 100%; color: rgba(255,255,255,0.7); }
.error-screen .ei { font-size: 32px; }
.error-screen .et { font-weight: 700; font-size: 14px; color: rgba(255,255,255,0.9); }
.error-screen .es { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@11.1.0/marked.min.js"></script>
</head>
<body>

<div id="panel" role="dialog" aria-label="Chat">
  <div class="header">
    <div class="av" aria-hidden="true">🤖<div class="av-dot"></div></div>
    <div>
      <div class="hname" id="h-name">Chat</div>
      <div class="hstatus">● Online · Replies instantly</div>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="btn-clear" aria-label="Clear conversation" title="Clear conversation">↺</button>
      <button class="hbtn" id="btn-close" aria-label="Close chat" title="Close chat">✕</button>
    </div>
  </div>
  <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Conversation"></div>
  <div class="chips" id="chips">
    <button class="chip" data-msg="Get a quote">💬 Get a quote</button>
    <button class="chip" data-msg="Book a service">📅 Book a service</button>
    <button class="chip" data-msg="See prices">💰 See prices</button>
    <button class="chip" data-msg="Areas covered">📍 Areas covered</button>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea class="inp" id="inp" rows="1" placeholder="Type a message..." aria-label="Message"></textarea>
      <button class="sbtn" id="sbtn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="ftxt">Powered by CleanBot AI</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ============================================================
  // CONFIG — read from URL params (passed in by widget.js)
  // ============================================================
  const params = new URL(window.location.href).searchParams;
  const clientId = params.get('clientId');
  const botName = params.get('botName') || 'Assistant';
  const businessName = params.get('businessName') || '';
  const botColor = params.get('botColor') || '#6366f1';

  // *** Webhook URL — CHANGE this when you migrate off ngrok ***
  const WEBHOOK_URL = 'https://sliver-aftermost-entrench.ngrok-free.dev/webhook/Chat';
  const TIMEOUT_MS = 20000;

  const $ = (id) => document.getElementById(id);

  if (!clientId) {
    document.getElementById('panel').innerHTML =
      '<div class="error-screen">' +
      '<div class="ei">⚠️</div>' +
      '<div class="et">No client ID provided</div>' +
      '<div class="es">This widget needs a clientId in the URL. Open it via the embed script tag with <code>data-client-id="..."</code>.</div>' +
      '</div>';
    return;
  }

  // Apply theme color
  document.documentElement.style.setProperty('--accent', botColor);
  document.documentElement.style.setProperty('--accent2', shade(botColor, -20));
  document.documentElement.style.setProperty('--accent-dim', hexToRgba(botColor, 0.1));
  document.documentElement.style.setProperty('--accent-border', hexToRgba(botColor, 0.3));
  document.documentElement.style.setProperty('--accent-dim-hover', hexToRgba(botColor, 0.25));

  $('h-name').textContent = botName;

  const WELCOME = businessName
    ? `Hi! I'm ${botName} for ${businessName}. How can I help you today?`
    : `Hi! I'm ${botName}. How can I help you today?`;

  const msgs = $('msgs');
  const chips = $('chips');
  const inp = $('inp');
  const sbtn = $('sbtn');

  let busy = false;
  let welcomed = false;

  const sessionKey = 'cleanbot_session_' + clientId;
  let sessionId = localStorage.getItem(sessionKey);
  if (!sessionId) {
    sessionId = 's_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2));
    localStorage.setItem(sessionKey, sessionId);
  }

  const isCoarsePointer = matchMedia('(pointer: coarse)').matches;
  if (window.marked && typeof marked.setOptions === 'function') {
    marked.setOptions({ gfm: true, breaks: true, headerIds: false, mangle: false });
  }

  function escapeHtml(t) {
    return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function formatBot(t) {
    if (window.marked && typeof marked.parse === 'function') return marked.parse(String(t));
    return escapeHtml(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  }
  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function ensureDateDivider() {
    if (!msgs.querySelector('.date-div')) {
      const d = document.createElement('div');
      d.className = 'date-div';
      d.textContent = 'Today';
      msgs.appendChild(d);
    }
  }
  function hideChips() { chips.hidden = true; chips.style.display = 'none'; }

  function botMsg(text, opts) {
    opts = opts || {};
    ensureDateDivider();
    const wrap = document.createElement('div');
    wrap.className = 'bot-msg';
    const av = document.createElement('div');
    av.className = 'bot-av';
    av.textContent = '🤖';
    const col = document.createElement('div');
    col.className = 'bot-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bot-bubble' + (opts.isError ? ' error' : '');
    bubble.innerHTML = opts.isError ? escapeHtml(text) : formatBot(text);
    const time = document.createElement('div');
    time.className = 'bot-time';
    time.textContent = timeNow();
    col.append(bubble, time);
    wrap.append(av, col);
    msgs.appendChild(wrap);
    wrap.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }

  function userMsg(text) {
    ensureDateDivider();
    hideChips();
    const wrap = document.createElement('div');
    wrap.className = 'user-msg';
    const col = document.createElement('div');
    col.className = 'user-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'user-bubble';
    bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'user-time';
    time.textContent = timeNow();
    col.append(bubble, time);
    wrap.appendChild(col);
    msgs.appendChild(wrap);
    wrap.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }

  function showTyping() {
    removeTyping();
    const d = document.createElement('div');
    d.className = 'typing';
    d.id = 'typ';
    d.innerHTML = '<div class="bot-av" aria-hidden="true">🤖</div>'
      + '<div class="typing-bubble"><div class="td"></div><div class="td"></div><div class="td"></div></div>';
    msgs.appendChild(d);
    d.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }
  function removeTyping() {
    const t = $('typ');
    if (t) t.remove();
  }

  async function send(text) {
    const message = (text || inp.value).trim();
    if (!message || busy) return;

    inp.value = '';
    inp.style.height = 'auto';
    userMsg(message);

    busy = true;
    sbtn.disabled = true;
    showTyping();

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true',
        },
        body: JSON.stringify({ message, session_id: sessionId, client_id: clientId }),
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      let reply;
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) {
        const data = await res.json();
        reply = data.reply || data.message || data.text || '';
      } else {
        const text = await res.text();
        try {
          const data = JSON.parse(text);
          reply = data.reply || data.message || data.text || text;
        } catch (e) { reply = text; }
      }
      if (!reply.trim()) reply = "I'm here to help! Could you tell me a bit more?";

      removeTyping();
      botMsg(reply);
    } catch (err) {
      removeTyping();
      const isTimeout = err && err.name === 'AbortError';
      const msg = isTimeout ? "That took too long — please try again in a moment." : "Sorry, I can't reach the server right now. Please try again.";
      botMsg(msg, { isError: true });
      console.error('[CleanBot] webhook failed:', err);
    } finally {
      clearTimeout(timer);
      busy = false;
      sbtn.disabled = false;
      inp.focus();
    }
  }

  function clearChat() {
    msgs.innerHTML = '';
    sessionId = 's_' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '_' + Math.random().toString(36).slice(2));
    localStorage.setItem(sessionKey, sessionId);
    welcomed = false;
    chips.hidden = false;
    chips.style.display = '';
    setTimeout(() => { welcomed = true; botMsg(WELCOME); }, 200);
  }

  function closeChat() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'cleanbot:close' }, '*');
    }
  }

  function init() {
    if (!welcomed) {
      welcomed = true;
      setTimeout(() => botMsg(WELCOME), 200);
    }
    $('btn-close').addEventListener('click', closeChat);
    $('btn-clear').addEventListener('click', clearChat);
    sbtn.addEventListener('click', () => send());
    chips.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (btn) send(btn.dataset.msg || btn.textContent.trim());
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !isCoarsePointer) {
        e.preventDefault();
        send();
      }
    });
    inp.addEventListener('input', () => {
      inp.style.height = 'auto';
      inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
    });
    setTimeout(() => inp.focus(), 350);
  }

  function hexToRgba(hex, alpha) {
    const m = String(hex).match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
    if (!m) return 'rgba(99,102,241,' + alpha + ')';
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + alpha + ')';
  }
  function shade(hex, percent) {
    const m = String(hex).match(/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i);
    if (!m) return hex;
    let r = parseInt(m[1], 16), g = parseInt(m[2], 16), b = parseInt(m[3], 16);
    const t = percent < 0 ? 0 : 255, p = Math.abs(percent) / 100;
    r = Math.round((t - r) * p) + r;
    g = Math.round((t - g) * p) + g;
    b = Math.round((t - b) * p) + b;
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  init();
})();
</script>
</body>
</html>
