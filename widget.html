<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanBot Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f0f13; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.bg { position: fixed; inset: 0; background: radial-gradient(ellipse 80% 60% at 20% 20%, rgba(99,102,241,0.08) 0%, transparent 60%); pointer-events: none; }
.grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; }

#launcher { position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; cursor: pointer; z-index: 9999; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(99,102,241,0.5); transition: transform 0.2s, box-shadow 0.2s; }
#launcher:hover { transform: scale(1.08); }
#launcher:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
.pulse { position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px; border-radius: 50%; background: rgba(99,102,241,0.3); z-index: 9998; animation: pulse 2.5s ease-out infinite; pointer-events: none; }
@keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(1.8); opacity: 0; } }

#panel { position: fixed; bottom: 104px; right: 28px; width: 360px; height: 540px; border-radius: 20px; z-index: 9997; background: rgba(13,13,20,0.97); -webkit-backdrop-filter: blur(40px); backdrop-filter: blur(40px); border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 32px 80px rgba(0,0,0,0.7); display: flex; flex-direction: column; overflow: hidden; transform: scale(0.9) translateY(16px); transform-origin: bottom right; opacity: 0; pointer-events: none; transition: all 0.35s cubic-bezier(0.34,1.2,0.64,1); }
#panel::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(99,102,241,0.7), transparent); }
#panel.open { transform: scale(1) translateY(0); opacity: 1; pointer-events: all; }

.header { padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.02); flex-shrink: 0; }
.av { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; position: relative; }
.av-dot { position: absolute; bottom: -1px; right: -1px; width: 11px; height: 11px; background: #22c55e; border-radius: 50%; border: 2px solid rgba(13,13,20,0.97); }
.hname { font-size: 14px; font-weight: 700; color: #f0f0f5; }
.hstatus { font-size: 11px; color: #22c55e; font-weight: 500; margin-top: 1px; }
.hbtns { margin-left: auto; display: flex; gap: 6px; }
.hbtn { width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; transition: all 0.15s; }
.hbtn:hover { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }
.hbtn:focus-visible { outline: 2px solid #6366f1; outline-offset: 1px; }

.msgs { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msgs::-webkit-scrollbar { width: 3px; }
.msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
.date-div { text-align: center; font-size: 11px; color: rgba(255,255,255,0.35); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin: 4px 0; }

.bot-msg { display: flex; gap: 8px; align-items: flex-start; animation: fadeUp 0.3s ease both; }
.bot-av { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; margin-top: 2px; }
.bot-wrap { display: flex; flex-direction: column; max-width: calc(100% - 38px); }
.bot-bubble { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); padding: 10px 14px; border-radius: 16px 16px 16px 4px; font-size: 14px; line-height: 1.6; word-break: break-word; }
.bot-bubble.error { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
.bot-bubble a { color: #a5b4fc; text-decoration: underline; }
.bot-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; padding-left: 4px; }

.user-msg { display: flex; justify-content: flex-end; animation: fadeUp 0.3s ease both; }
.user-wrap { display: flex; flex-direction: column; align-items: flex-end; max-width: 75%; }
.user-bubble { background: linear-gradient(135deg, #6366f1, #7c3aed); color: white; font-weight: 600; padding: 10px 14px; border-radius: 16px 16px 4px 16px; font-size: 14px; line-height: 1.6; box-shadow: 0 4px 16px rgba(99,102,241,0.3); word-break: break-word; white-space: normal; }
.user-time { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 4px; padding-right: 4px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.typing { display: flex; gap: 8px; align-items: flex-start; animation: fadeUp 0.3s ease both; }
.typing-bubble { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px 16px 16px 4px; padding: 12px 16px; display: flex; gap: 5px; align-items: center; }
.td { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); animation: tdB 1.2s ease infinite; }
.td:nth-child(2) { animation-delay: 0.15s; }
.td:nth-child(3) { animation-delay: 0.3s; }
@keyframes tdB { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-5px); opacity: 1; } }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 8px; flex-shrink: 0; }
.chip { padding: 7px 13px; border-radius: 100px; background: rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.3); color: rgba(160,165,255,0.9); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap; }
.chip:hover { background: rgba(99,102,241,0.25); color: white; }
.chip:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }

.input-area { padding: 10px 14px 14px; border-top: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
.inp { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 13px; color: rgba(255,255,255,0.9); font-family: inherit; font-size: 14px; outline: none; resize: none; max-height: 100px; min-height: 42px; line-height: 1.5; transition: all 0.2s; overflow-y: auto; }
.inp::placeholder { color: rgba(255,255,255,0.35); }
.inp:focus { border-color: rgba(99,102,241,0.6); background: rgba(255,255,255,0.07); }
.sbtn { width: 42px; height: 42px; border-radius: 11px; background: linear-gradient(135deg, #6366f1, #7c3aed); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
.sbtn:hover:not(:disabled) { transform: scale(1.08); }
.sbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.sbtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.ftxt { text-align: center; font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 8px; }

@media (max-width: 480px) { #panel { width: calc(100vw - 20px); right: 10px; bottom: 90px; height: 72vh; } #launcher, .pulse { bottom: 20px; right: 20px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div style="text-align:center;position:relative;z-index:1;"><h1 style="font-size:clamp(32px,5vw,64px);font-weight:700;color:rgba(255,255,255,0.04);letter-spacing:-2px;user-select:none">Sparkle Clean</h1></div>

<div class="pulse" id="pulse" aria-hidden="true"></div>
<button id="launcher" aria-label="Open chat" aria-expanded="false" aria-controls="panel">
  <span id="ic-chat" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></span>
  <span id="ic-close" hidden aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
</button>

<div id="panel" role="dialog" aria-label="Chat with SparkleBot" aria-hidden="true">
  <div class="header">
    <div class="av" aria-hidden="true">🧹<div class="av-dot"></div></div>
    <div>
      <div class="hname">SparkleBot</div>
      <div class="hstatus">● Online · Replies instantly</div>
    </div>
    <div class="hbtns">
      <button class="hbtn" id="btn-clear" aria-label="Clear conversation" title="Clear conversation">↺</button>
      <button class="hbtn" id="btn-close" aria-label="Close chat" title="Close chat">✕</button>
    </div>
  </div>
  <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Conversation"></div>
  <div class="chips" id="chips">
    <button class="chip" data-msg="Get a quote">💬 Get a quote</button>
    <button class="chip" data-msg="Book a clean">📅 Book a clean</button>
    <button class="chip" data-msg="See prices">💰 See prices</button>
    <button class="chip" data-msg="Areas covered">📍 Areas covered</button>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea class="inp" id="inp" rows="1" placeholder="Type a message..." aria-label="Message"></textarea>
      <button class="sbtn" id="sbtn" aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="ftxt">Powered by CleanBot AI</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const CONFIG = {
    webhook: 'https://sliver-aftermost-entrench.ngrok-free.dev/webhook/Chat',
    clientId: '90710242-5d2e-4990-8f10-bb4b0001bb3e',
    businessName: 'Sparkle Clean',
    welcome: "Hi! I'm SparkleBot for Sparkle Clean. How can I help you today?",
    timeoutMs: 20000,
  };

  const $ = (id) => document.getElementById(id);
  const launcher = $('launcher');
  const panel = $('panel');
  const msgs = $('msgs');
  const chips = $('chips');
  const inp = $('inp');
  const sbtn = $('sbtn');
  const pulse = $('pulse');
  const icChat = $('ic-chat');
  const icClose = $('ic-close');

  let isOpen = false;
  let busy = false;
  let welcomed = false;

  // Persistent session ID — survives page refresh, resets only on clear
  let sessionId = localStorage.getItem('cleanbot_session');
  if (!sessionId) {
    sessionId = 's_' + crypto.randomUUID();
    localStorage.setItem('cleanbot_session', sessionId);
  }

  const isCoarsePointer = matchMedia('(pointer: coarse)').matches;

  function escapeHtml(t) {
    return String(t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatBot(t) {
    let out = escapeHtml(t)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    out = out.replace(
      /\bhttps?:\/\/[^\s<]+/g,
      (url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
    );
    return out;
  }

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function ensureDateDivider() {
    if (!msgs.querySelector('.date-div')) {
      const d = document.createElement('div');
      d.className = 'date-div';
      d.textContent = 'Today';
      msgs.appendChild(d);
    }
  }

  function botMsg(text, { isError = false } = {}) {
    ensureDateDivider();
    const wrap = document.createElement('div');
    wrap.className = 'bot-msg';
    const av = document.createElement('div');
    av.className = 'bot-av';
    av.setAttribute('aria-hidden', 'true');
    av.textContent = '🤖';
    const col = document.createElement('div');
    col.className = 'bot-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'bot-bubble' + (isError ? ' error' : '');
    bubble.innerHTML = formatBot(text);
    const time = document.createElement('div');
    time.className = 'bot-time';
    time.textContent = timeNow();
    col.append(bubble, time);
    wrap.append(av, col);
    msgs.appendChild(wrap);
    wrap.scrollIntoView({ block: 'start', behavior: 'smooth' });
  }

  function userMsg(text) {
    ensureDateDivider();
    hideChips();
    const wrap = document.createElement('div');
    wrap.className = 'user-msg';
    const col = document.createElement('div');
    col.className = 'user-wrap';
    const bubble = document.createElement('div');
    bubble.className = 'user-bubble';
    bubble.textContent = text;
    const time = document.createElement('div');
    time.className = 'user-time';
    time.textContent = timeNow();
    col.append(bubble, time);
    wrap.appendChild(col);
    msgs.appendChild(wrap);
    wrap.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }

  function showTyping() {
    removeTyping();
    const d = document.createElement('div');
    d.className = 'typing';
    d.id = 'typ';
    d.innerHTML = '<div class="bot-av" aria-hidden="true">🤖</div>'
      + '<div class="typing-bubble" aria-label="Bot is typing">'
      + '<div class="td"></div><div class="td"></div><div class="td"></div></div>';
    msgs.appendChild(d);
    d.scrollIntoView({ block: 'end', behavior: 'smooth' });
  }
  function removeTyping() {
    const t = $('typ');
    if (t) t.remove();
  }

  function hideChips() {
    chips.hidden = true;
    chips.style.display = 'none';
  }

  function setOpen(open) {
    isOpen = open;
    panel.classList.toggle('open', open);
    panel.setAttribute('aria-hidden', String(!open));
    launcher.setAttribute('aria-expanded', String(open));
    icChat.hidden = open;
    icClose.hidden = !open;
    pulse.style.display = 'none';
    if (open) {
      if (!welcomed) {
        welcomed = true;
        setTimeout(() => botMsg(CONFIG.welcome), 200);
      }
      setTimeout(() => inp.focus(), 350);
    } else {
      launcher.focus();
    }
  }

  async function send(text) {
    const message = (text ?? inp.value).trim();
    if (!message || busy) return;

    inp.value = '';
    inp.style.height = 'auto';
    userMsg(message);

    busy = true;
    sbtn.disabled = true;
    showTyping();

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.timeoutMs);

    try {
      const res = await fetch(CONFIG.webhook, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true',
        },
        body: JSON.stringify({
          message,
          session_id: sessionId,
          client_id: CONFIG.clientId,
        }),
        signal: ctrl.signal,
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);

      let reply;
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('application/json')) {
        const data = await res.json();
        reply = data.reply || data.message || data.text || '';
      } else {
        reply = await res.text();
      }
      if (!reply.trim()) reply = "I'm here to help! Could you tell me a bit more?";

      removeTyping();
      botMsg(reply);
    } catch (err) {
      removeTyping();
      const isTimeout = err && err.name === 'AbortError';
      const msg = isTimeout
        ? "That took too long — please try again in a moment."
        : "Sorry, I can't reach the server right now. Please try again.";
      botMsg(msg, { isError: true });
      console.error('[CleanBot] webhook failed:', err);
    } finally {
      clearTimeout(timer);
      busy = false;
      sbtn.disabled = false;
      inp.focus();
    }
  }

  function clearChat() {
    msgs.innerHTML = '';
    // Generate a new session ID and clear localStorage
    sessionId = 's_' + crypto.randomUUID();
    localStorage.setItem('cleanbot_session', sessionId);
    welcomed = false;
    chips.hidden = false;
    chips.style.display = '';
    setTimeout(() => {
      welcomed = true;
      botMsg(CONFIG.welcome);
    }, 200);
  }

  launcher.addEventListener('click', () => setOpen(!isOpen));
  $('btn-close').addEventListener('click', () => setOpen(false));
  $('btn-clear').addEventListener('click', clearChat);
  sbtn.addEventListener('click', () => send());

  chips.addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (btn) send(btn.dataset.msg || btn.textContent.trim());
  });

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !isCoarsePointer) {
      e.preventDefault();
      send();
    }
  });
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 100) + 'px';
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && isOpen) setOpen(false);
  });
})();
</script>
</body>
</html>
