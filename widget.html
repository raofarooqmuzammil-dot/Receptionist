<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanBot Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0f0f13;min-height:100vh;display:flex;align-items:center;justify-content:center}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 20% 20%,rgba(99,102,241,.08) 0%,transparent 60%);pointer-events:none}
.grid{position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:48px 48px;pointer-events:none}

/* LAUNCHER */
#launcher{position:fixed;bottom:28px;right:28px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;cursor:pointer;z-index:9999;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 32px rgba(99,102,241,.5);transition:transform .2s}
#launcher:hover{transform:scale(1.08)}
.pulse{position:fixed;bottom:28px;right:28px;width:60px;height:60px;border-radius:50%;background:rgba(99,102,241,.3);z-index:9998;animation:pulse 2.5s ease-out infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.8);opacity:0}}
.badge{position:absolute;top:-2px;right:-2px;width:18px;height:18px;background:#ef4444;border-radius:50%;border:2px solid #0f0f13;font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center}

/* PANEL - FIXED HEIGHT IS KEY */
#panel{
  position:fixed;bottom:104px;right:28px;
  width:360px;
  border-radius:20px;z-index:9997;
  background:rgba(13,13,20,.97);
  backdrop-filter:blur(40px);
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 32px 80px rgba(0,0,0,.7);
  
  /* FLEXBOX COLUMN - KEY FOR SCROLL */
  display:flex;
  flex-direction:column;
  
  /* FIXED HEIGHT */
  height:540px;
  max-height:540px;
  
  overflow:hidden;
  transform:scale(.9) translateY(16px);
  transform-origin:bottom right;
  opacity:0;pointer-events:none;
  transition:all .35s cubic-bezier(.34,1.2,.64,1);
}
#panel::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(99,102,241,.7),transparent)}
#panel.open{transform:scale(1) translateY(0);opacity:1;pointer-events:all}

/* HEADER - FIXED, NEVER GROWS */
.header{
  padding:14px 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,.05);
  background:rgba(255,255,255,.02);
  flex-shrink:0; /* NEVER SHRINK */
}
.av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative}
.av-dot{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;background:#22c55e;border-radius:50%;border:2px solid rgba(13,13,20,.97)}
.hname{font-size:14px;font-weight:700;color:#f0f0f5}
.hstatus{font-size:11px;color:#22c55e;font-weight:500;margin-top:1px}
.hbtns{margin-left:auto;display:flex;gap:6px}
.hbtn{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);color:rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s}
.hbtn:hover{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8)}

/* MESSAGES - SCROLLABLE, TAKES REMAINING SPACE */
.msgs{
  flex:1; /* TAKE ALL REMAINING SPACE */
  min-height:0; /* CRITICAL FOR FLEX SCROLL */
  overflow-y:auto;
  overflow-x:hidden;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.msgs::-webkit-scrollbar{width:3px}
.msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.date-div{text-align:center;font-size:11px;color:rgba(255,255,255,.2);font-weight:600;letter-spacing:1px;text-transform:uppercase;margin:4px 0;flex-shrink:0}

/* BOT MESSAGE */
.bot-msg{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .3s ease both;flex-shrink:0}
.bot-av{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.bot-wrap{display:flex;flex-direction:column;max-width:calc(100% - 38px)}
.bot-bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);color:rgba(255,255,255,.9);padding:10px 14px;border-radius:16px 16px 16px 4px;font-size:14px;line-height:1.6;word-break:break-word}
.bot-time{font-size:10px;color:rgba(255,255,255,.2);margin-top:4px;padding-left:4px}

/* USER MESSAGE */
.user-msg{display:flex;justify-content:flex-end;animation:fadeUp .3s ease both;flex-shrink:0}
.user-wrap{display:flex;flex-direction:column;align-items:flex-end;max-width:75%}
.user-bubble{
  background:linear-gradient(135deg,#6366f1,#7c3aed);
  color:#fff;font-weight:600;
  padding:10px 14px;
  border-radius:16px 16px 4px 16px;
  font-size:14px;line-height:1.6;
  box-shadow:0 4px 16px rgba(99,102,241,.3);
  word-break:break-word;
  white-space:normal;
}
.user-time{font-size:10px;color:rgba(255,255,255,.2);margin-top:4px;padding-right:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* TYPING */
.typing{display:flex;gap:8px;align-items:flex-start;animation:fadeUp .3s ease both;flex-shrink:0}
.typing-bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:16px 16px 16px 4px;padding:12px 16px;display:flex;gap:5px;align-items:center}
.td{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);animation:tdB 1.2s ease infinite}
.td:nth-child(2){animation-delay:.15s}
.td:nth-child(3){animation-delay:.3s}
@keyframes tdB{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* CHIPS - FIXED, NEVER GROWS */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:6px 14px 8px;flex-shrink:0}
.chip{padding:6px 12px;border-radius:100px;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.3);color:rgba(160,165,255,.9);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
.chip:hover{background:rgba(99,102,241,.25);color:#fff}

/* INPUT - FIXED, NEVER GROWS UNBOUNDED */
.input-area{padding:10px 14px 14px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
.input-row{display:flex;gap:8px;align-items:flex-end}
.inp{flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 13px;color:rgba(255,255,255,.9);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;outline:none;resize:none;line-height:1.5;transition:all .2s;overflow-y:hidden;height:42px}
.inp::placeholder{color:rgba(255,255,255,.2)}
.inp:focus{border-color:rgba(99,102,241,.5);background:rgba(255,255,255,.07)}
.sbtn{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#7c3aed);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.sbtn:hover{transform:scale(1.08)}
.sbtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.ftxt{text-align:center;font-size:11px;color:rgba(255,255,255,.12);margin-top:8px}

@media(max-width:480px){#panel{width:calc(100vw - 20px);right:10px;bottom:90px;height:72vh}#launcher{bottom:20px;right:20px}.pulse{bottom:20px;right:20px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="grid"></div>
<div style="text-align:center;position:relative;z-index:1">
  <h1 style="font-size:clamp(32px,5vw,64px);font-weight:700;color:rgba(255,255,255,.04);letter-spacing:-2px;user-select:none">Sparkle Clean</h1>
</div>
<div class="pulse" id="pulse"></div>
<button id="launcher" onclick="toggle()">
  <span class="badge">1</span>
  <span id="ic-chat"><svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg></span>
  <span id="ic-close" style="display:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
</button>
<div id="panel">
  <div class="header">
    <div class="av">🧹<div class="av-dot"></div></div>
    <div>
      <div class="hname">SparkleBot</div>
      <div class="hstatus">● Online · Replies instantly</div>
    </div>
    <div class="hbtns">
      <button class="hbtn" onclick="clearChat()">↺</button>
      <button class="hbtn" onclick="toggle()">✕</button>
    </div>
  </div>
  <div class="msgs" id="msgs">
    <div class="date-div">Today</div>
  </div>
  <div class="chips" id="chips">
    <button class="chip" onclick="quickSend('Get a quote')">💬 Get a quote</button>
    <button class="chip" onclick="quickSend('Book a clean')">📅 Book a clean</button>
    <button class="chip" onclick="quickSend('See prices')">💰 See prices</button>
    <button class="chip" onclick="quickSend('Areas covered')">📍 Areas covered</button>
  </div>
  <div class="input-area">
    <div class="input-row">
      <textarea class="inp" id="inp" placeholder="Type a message..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
        oninput="this.style.height='42px';this.style.height=Math.min(this.scrollHeight,100)+'px'"></textarea>
      <button class="sbtn" id="sbtn" onclick="send()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="ftxt">Powered by CleanBot AI</div>
  </div>
</div>

<script>
const WEBHOOK = 'https://sliver-aftermost-entrench.ngrok-free.dev/webhook/Chat';
const WELCOME = "Hi! I'm SparkleBot for Sparkle Clean. How can I help you today?";

let isOpen=false, busy=false, sid='s'+Date.now(), hist=[];

// Init
window.onload = () => setTimeout(() => addBot(WELCOME), 800);

// Toggle panel
function toggle(){
  isOpen = !isOpen;
  document.getElementById('panel').classList.toggle('open', isOpen);
  document.querySelector('.badge').style.display = 'none';
  document.getElementById('pulse').style.display = 'none';
  document.getElementById('ic-chat').style.display = isOpen ? 'none' : 'block';
  document.getElementById('ic-close').style.display = isOpen ? 'block' : 'none';
  if(isOpen) setTimeout(() => document.getElementById('inp').focus(), 400);
}

// Add bot message and scroll to its TOP
function addBot(text){
  const msgs = document.getElementById('msgs');
  const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const el = document.createElement('div');
  el.className = 'bot-msg';
  el.innerHTML = `
    <div class="bot-av">🤖</div>
    <div class="bot-wrap">
      <div class="bot-bubble">${fmt(text)}</div>
      <div class="bot-time">${t}</div>
    </div>`;
  msgs.appendChild(el);

  // Wait for render then scroll to TOP of this message
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      msgs.scrollTop = el.offsetTop - msgs.offsetTop - 12;
    });
  });

  document.getElementById('chips').style.display = 'flex';
}

// Add user message and scroll to bottom
function addUser(text){
  const msgs = document.getElementById('msgs');
  const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  document.getElementById('chips').style.display = 'none';
  const el = document.createElement('div');
  el.className = 'user-msg';
  el.innerHTML = `
    <div class="user-wrap">
      <div class="user-bubble">${esc(text)}</div>
      <div class="user-time">${t}</div>
    </div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}

// Typing indicator
function showTyping(){
  removeTyping();
  const msgs = document.getElementById('msgs');
  const el = document.createElement('div');
  el.className = 'typing'; el.id = 'typ';
  el.innerHTML = `<div class="bot-av">🤖</div><div class="typing-bubble"><div class="td"></div><div class="td"></div><div class="td"></div></div>`;
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
}
function removeTyping(){ const t=document.getElementById('typ'); if(t) t.remove(); }

// Send message
async function send(text){
  const inp = document.getElementById('inp');
  const msg = text || inp.value.trim();
  if(!msg || busy) return;
  inp.value = ''; inp.style.height = '42px';
  addUser(msg);
  hist.push({role:'user', content:msg});
  busy = true;
  document.getElementById('sbtn').disabled = true;
  showTyping();
  try {
    const res = await fetch(WEBHOOK, {
      method: 'POST',
      headers: {'Content-Type':'application/json','ngrok-skip-browser-warning':'true'},
      body: JSON.stringify({message:msg, sessionId:sid, history:hist.slice(-10), businessName:'Sparkle Clean'})
    });
    removeTyping();
    let reply;
    const ct = res.headers.get('content-type') || '';
    if(ct.includes('application/json')){
      const d = await res.json();
      reply = d.reply || d.message || d.text || '';
    } else {
      reply = await res.text();
    }
    if(!reply || !reply.trim()) reply = "I'm here to help! Could you tell me a bit more?";
    hist.push({role:'assistant', content:reply});
    addBot(reply);
  } catch(e) {
    removeTyping();
    const demos = [
      "I'd love to help! How many bedrooms does your property have?",
      "For a 3-bed regular clean we charge £140. Want to check availability?",
      "We have slots this week — Friday 10am, Monday 2pm. Which works?",
      "Can I take your name and phone number to confirm?"
    ];
    const r = demos[Math.floor(hist.length/2) % demos.length];
    hist.push({role:'assistant', content:r});
    addBot(r);
  }
  busy = false;
  document.getElementById('sbtn').disabled = false;
}

function quickSend(text){ send(text); }
function clearChat(){
  document.getElementById('msgs').innerHTML = '<div class="date-div">Today</div>';
  hist = []; sid = 's'+Date.now();
  setTimeout(() => addBot(WELCOME), 300);
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(t){
  let s = esc(t);
  s = s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\|[-:\s|]+\|/g,'');
  s = s.replace(/\n/g,'<br>');
  return s;
}
</script>
</body>
</html>
